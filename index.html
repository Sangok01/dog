      const s = S(), d = G().D(); let tab = 'story';
      const draw = () => {
        let body = '';
        if (tab === 'story') body = `<div class="list">${CHAPTERS.map((c, i) => { const [a, n] = c.prog(s, d); const st = i < s.chapter ? 'done' : i === s.chapter ? '' : 'lock'; return `<div class="li ${st}"><span class="ic big">${i < s.chapter ? '✅' : i === s.chapter ? '📔' : '🔒'}</span><span class="tx"><b>${i + 1}장. ${i <= s.chapter ? esc(c.title) : '???'}</b><span class="muted">${i <= s.chapter ? esc(c.goal) : '앞 장을 마치면 열려요'}</span>${i === s.chapter ? bar(a / n * 100, '#3fae5a') + `<span class="muted">보상 🪙${c.reward.coins}${c.reward.item ? ' + ' + ITEMS[c.reward.item].name : ''}</span>` : ''}</span></div>`; }).join('')}</div>`;
        if (tab === 'today') body = `<p><b>${s.day}일째 · ${esc(G().todayEv().title)}</b><br>${esc(G().todayEv().text)}</p>` + $('#missions').innerHTML;
        if (tab === 'log') body = s.log.length ? `<div class="list">${s.log.slice().reverse().map((l) => `<div class="li"><span class="tx"><b>${l.day}일째 · ${esc(l.event)}</b><span class="muted">${esc(l.dog)} · 친밀도 ♥${l.bond} · 산책 ${l.walk}m · 미션 ${l.missions}/3</span></span></div>`).join('')}</div>` : '<p class="muted">하루가 끝나면 일기가 써져요.</p>';
        const w = win('📔 멍멍 다이어리', body, { w: 760, tabs: tabs([['story', '이야기'], ['today', '오늘'], ['log', '일기']], tab) });
        bindTabs(w, (t) => { tab = t; draw(); });
      };
      draw();
    },
    vet() {
      const s = S(), d = G().D(), cost = d.health >= 90 ? 0 : 120;
      const w = win('🏥 동물병원', `<div class="shopkeep"><img src="${IMG.face_n_mayor}" alt=""><p>안녕하세요, 수의사예요. ${esc(d.name)}의 건강은 <b>${Math.round(d.health)}</b>이에요. ${d.health >= 90 ? '아주 건강하네요! 오늘처럼 잘 돌봐 주세요.' : '조금 지쳐 보여요. 진찰하고 영양제를 놓아 줄게요.'}</p></div>
        <div class="row"><button class="btn" data-a="heal" ${d.health >= 90 || s.coins < cost ? 'disabled' : ''}>진찰받기 (🪙${cost})</button><button class="btn alt" data-a="no">괜찮아요</button></div><p class="muted">건강을 지키려면: 밥 잘 먹기 · 깨끗하게 씻기 · 푹 자기 · 간식은 조금만!</p>`, { w: 600 });
      $('[data-a=heal]', w).onclick = () => { s.coins -= cost; d.health = 100; d.tummy = 0; Sound.sfx('good'); toast(`${J(d.name, '이', '가')} 건강해졌어요! 💚`); closeAll(); };
      $('[data-a=no]', w).onclick = () => closeAll();
    },
    cafe() {
      const s = S(), d = G().D();
      const w = win('☕ 멍멍 카페', `<p>강아지와 함께 쉬어 가는 카페예요. 강아지용 간식 쿠키를 먹으며 쉬면 기운이 돌아와요.</p><div class="row"><button class="btn" data-a="rest" ${s.coins < 60 ? 'disabled' : ''}>쉬어 가기 (🪙60 · 기운 +25 · 행복 +8)</button><button class="btn alt" data-a="no">다음에</button></div>`, { w: 560 });
      $('[data-a=rest]', w).onclick = () => { s.coins -= 60; d.energy = Math.min(100, d.energy + 25); G().happy(d, 8); G().S.min += 30; Sound.sfx('crunch'); toast('맛있는 쿠키를 먹고 푹 쉬었어요!'); closeAll(); };
      $('[data-a=no]', w).onclick = () => closeAll();
    },
    settings(arg) {
      const st = (S() && S().settings) || JSON.parse(localStorage.getItem('mung-settings') || 'null') || { bgm: 0.6, sfx: 0.85, speed: 1, shake: 1, quality: 1 };
      const seg = (k, o) => `<div class="seg">${o.map(([v, t]) => `<button data-k="${k}" data-v="${v}" class="${st[k] == v ? 'on' : ''}">${t}</button>`).join('')}</div>`;
      const inGame = !!S() && !(arg && arg.title);
      const w = win('⚙️ 설정 · 일시정지', `<div class="set"><label for="sb">배경음악</label><input id="sb" type="range" min="0" max="1" step="0.1" value="${st.bgm}"><label for="ss">효과음</label><input id="ss" type="range" min="0" max="1" step="0.1" value="${st.sfx}">
        <span>시간 빠르기</span>${seg('speed', [[0.5, '느리게'], [1, '보통 (하루 약 7분)'], [2, '빠르게']])}<span>그래픽</span>${seg('quality', [[1, '보통'], [0, '가볍게']])}</div>
        <p class="muted">조작: 강아지 위를 누른 채 문지르면 쓰다듬기(머리·등·귀·배마다 반응이 달라요) · 장난감을 고르고 화면을 위로 휙 → 던지기 · 끌기 → 카메라 돌리기 · 휠/두 손가락 → 확대 · 산책: WASD·방향키·조이스틱 또는 땅 누르기 · E/스페이스 행동 · C 부르기 · P 칭찬</p>
        ${inGame ? `<div class="row"><button class="btn" data-a="go">▶ 계속하기</button><button class="btn alt" data-a="save">💾 저장</button><button class="btn alt" data-a="day">🌙 오늘 하루 마치기</button><button class="btn alt" data-a="title">🏠 시작 화면</button><button class="btn red" data-a="reset">처음부터</button></div><p class="muted">자동 저장: 30초마다 · 하루가 끝날 때 · 창을 닫을 때${Progress.student ? ' · 선생님 현황판에도 기록이 보내져요' : ''}</p>` : ''}`, { w: 720 });
      const apply = () => { Sound.setVol(+st.bgm, +st.sfx); if (G().R) G().R.lowQ = !+st.quality; try { localStorage.setItem('mung-settings', JSON.stringify(st)); } catch (e) { /* 이번만 */ } };
      $('#sb', w).oninput = (e) => { st.bgm = +e.target.value; apply(); }; $('#ss', w).oninput = (e) => { st.sfx = +e.target.value; apply(); Sound.sfx('ui'); };
      $$('[data-k]', w).forEach((b) => (b.onclick = () => { st[b.dataset.k] = +b.dataset.v; apply(); $$(`[data-k=${b.dataset.k}]`, w).forEach((x) => x.classList.toggle('on', x === b)); }));
      $$('[data-a]', w).forEach((b) => (b.onclick = () => { const a = b.dataset.a;
        if (a === 'go') closeAll(); if (a === 'save') { G().save(true); toast('저장했어요.'); }
        if (a === 'day') { closeAll(); G().endDay(); }
        if (a === 'title') { G().save(true); closeAll(); G().rt.paused = true; G().rt.scene = 'title'; showTitle(); }
        if (a === 'reset' && confirm('정말 처음부터 할까요? 이 브라우저의 기록이 지워져요.')) { try { localStorage.removeItem(G().SAVE_KEY); } catch (e) { /* 무시 */ } location.reload(); } }));
    },
  };

  /* ── 하루 시작·마무리 ── */
  function dayCard(ev) {
    const s = S(); const w = win(`☀️ ${s.day}일째 아침`, `<div class="res"><div class="big">${esc(ev.title)}</div><p>${esc(ev.text)}</p><div class="mis">${s.missions.map((m) => { const M = MISSIONS.find((x) => x.id === m.id); return `<span>⬜ ${M.text} · 🪙${M.coins}</span>`; }).join('')}</div><button class="btn big" data-a="ok">좋아요!</button></div>`, { w: 560 });
    $('[data-a=ok]', w).onclick = () => closeAll();
  }
  function daySummary(next) {
    const s = S(), d = G().D(), l = s.log[s.log.length - 1];
    const w = win(`🌙 ${s.day}일째 하루 끝`, `<div class="res"><img class="sleepy" src="${IMG['face_d_' + d.breed]}" alt=""><p><b>${esc(d.name)}</b>가 새근새근 잠들었어요.</p><p class="muted">친밀도 ♥${l.bond} · 산책 ${l.walk}m · 오늘의 미션 ${l.missions}/3 완료</p><p>${['내일도 함께 놀자!', '오늘도 고마워, 내 친구.', '꿈에서도 공놀이 하자!', '내일은 어디로 산책 갈까?'][s.day % 4]}</p><button class="btn big" data-a="ok">다음 날로 →</button></div>`, { w: 520, noX: 1 });
    Sound.sfx('sleep'); $('[data-a=ok]', w).onclick = () => { closeAll(); fade(() => next()); };
  }

  /* ── 대화창 ── */
  let typeTimer = null;
  function talk(o) {
    talkOpen = true; const el = $('#talk'); el.classList.remove('hidden');
    el.innerHTML = `<div class="face">${o.face && IMG['face_' + o.face] ? `<img src="${IMG['face_' + o.face]}" alt="">` : '🐶'}</div><div class="box"><div class="nm">${esc(o.name)}</div><div class="tx" aria-live="polite"></div><div class="ch"></div></div>`;
    const tx = $('.tx', el), ch = $('.ch', el); let i = 0; clearInterval(typeTimer);
    const done = () => { clearInterval(typeTimer); tx.textContent = o.text; ch.innerHTML = (o.choices || [{ t: '확인', f: endTalk }]).map((c, k) => `<button data-c="${k}">${esc(c.t)}</button>`).join(''); $$('button', ch).forEach((b) => (b.onclick = (e) => { e.stopPropagation(); Sound.sfx('ui'); (o.choices ? o.choices[+b.dataset.c].f : endTalk)(); })); };
    typeTimer = setInterval(() => { i++; tx.textContent = o.text.slice(0, i); if (i >= o.text.length) done(); }, 26);
    el.onclick = () => { if (tx.textContent.length < o.text.length) done(); };
  }
  function endTalk() { talkOpen = false; clearInterval(typeTimer); $('#talk').classList.add('hidden'); $('#talk').innerHTML = ''; G().rt.talking = null; }

  /* ── 버튼 묶기 ── */
  function init() {
    $$('#title .hot').forEach((b) => (b.onclick = () => onTitle(b.dataset.k)));
    addEventListener('resize', layoutTitle);
    $('#actbtn').onclick = () => { Sound.unlock(); G().act(); };
    $$('#bar button, #menu button').forEach((b) => (b.onclick = () => {
      const g = G(), a = b.dataset.a, tool = b.dataset.tool; Sound.unlock(); Sound.sfx('ui');
      if (tool) { if (tool === 'toy') return open('toys'); g.rt.tool = tool; refresh(); toast(tool === 'brush' ? '🪮 빗을 들었어요. 강아지를 문질러 빗질해요.' : '✋ 손으로 쓰다듬어요. 머리·등·귀·배를 문질러 보세요.'); return; }
      switch (a) {
        case 'call': return g.callDog(); case 'praise': return g.praise(); case 'food': return open('food'); case 'bath': return Bath.start();
        case 'train': return open('train'); case 'tricks': return open('tricks'); case 'walk': return fade(() => g.startWalk()); case 'sleep': return g.sleepDog();
        case 'home': return g.endWalk(); case 'shop': return open('shop'); case 'closet': return open('closet'); case 'decor': return open('decor');
        case 'dex': return open('dex'); case 'diary': return open('diary'); case 'contest': return open('contest'); case 'bag': return open('bag'); case 'settings': return open('settings');
        case 'adopt': return Shelter.open(g.S, false);
      }
    }));
    // 조이스틱
    const joy = $('#joy'), knob = $('i', joy); let id = null;
    const mv = (t) => { const r = joy.getBoundingClientRect(); let dx = (t.clientX - r.left - r.width / 2) / (r.width / 2), dy = (t.clientY - r.top - r.height / 2) / (r.height / 2); const l = Math.hypot(dx, dy); if (l > 1) { dx /= l; dy /= l; } G().rt.joy = { x: dx, y: dy, on: true }; knob.style.transform = `translate(${dx * 40}px,${dy * 40}px)`; };
    joy.addEventListener('touchstart', (e) => { e.preventDefault(); id = e.changedTouches[0].identifier; mv(e.changedTouches[0]); }, { passive: false });
    joy.addEventListener('touchmove', (e) => { e.preventDefault(); for (const t of e.changedTouches) if (t.identifier === id) mv(t); }, { passive: false });
    const end = (e) => { for (const t of e.changedTouches) if (t.identifier === id) { id = null; G().rt.joy = { x: 0, y: 0, on: false }; knob.style.transform = ''; } };
    joy.addEventListener('touchend', end); joy.addEventListener('touchcancel', end);
  }
  return { init, toast, pop, fatal, fade, zone, showTitle, startGame, setMode, refresh, frame, open, closeAll, modalOpen, talk, endTalk, dayCard, daySummary, icon, iconText, esc, fmt, get mode() { return mode; }, get modal() { return modal; }, get isTouch() { return isTouch; } };
})();

/* ── 보호소: 3D 강아지 8마리 중 골라 입양 ── */
const Shelter = (() => {
  let st = null, first = false, sel = 0, pups = [], persPick = null;
  function open(state, isFirst) {
    if (!state) return; st = state; first = isFirst; sel = 0; persPick = null;
    const g = Game, rt = g.rt;
    if (!isFirst && state.dogs.length >= 3) return UI.toast('강아지는 세 마리까지 함께 살 수 있어요.');
    if (!isFirst && !CHAPTERS.slice(0, 12).every((c, i) => i < state.chapter) && heartOf(g.D()) < 5) return UI.toast('두 번째 가족은 지금 강아지와 친밀도 ♥5가 되거나 다이어리 12장까지 진행하면 만날 수 있어요.');
    // 3D 무대: 집 마당 장면을 보호소 마당으로 사용
    if (!rt.home) { rt.home = { root: Scenes.buildHome(), furn: {} }; }
    rt.prevScene = rt.scene; rt.scene = 'shelter'; rt.paused = false;
    pups = BREEDS.map((b, i) => { const p = new g.Pup(g.newDog(b.id, b.name, b.pers[0])); const a = (i - 3.5) * 0.3; p.x = Math.sin(a) * 6.4; p.z = -Math.cos(a) * 6.4 + 4.6; p.ry = Math.atan2(-p.x, 6 - p.z); p.mode = 'hold'; p.holdAnim = i % 3 ? 'sit' : 'idle'; return p; });
    rt.shelter = { pups };
    document.getElementById('title').classList.add('hidden'); document.getElementById('hud').classList.add('hidden');
    rt.cam.yaw = 0; rt.cam.yawT = 0; rt.cam.dist = 5.4; rt.cam.pitch = 0.3;
    Sound.play('day'); draw();
  }
  function draw() {
    const b = BREEDS[sel], el = document.getElementById('shelter'); el.classList.remove('hidden');
    const P = persPick || b.pers[0];
    el.innerHTML = `<div class="sh-top"><b>🏠 행복 보호소</b><span>${first ? '처음으로 함께할 가족을 골라요' : '새 가족을 맞이해요'} · 좌우로 넘겨 보세요</span>${first ? '' : '<button class="sh-x">닫기</button>'}</div>
      <button class="sh-arrow l" aria-label="이전">◀</button><button class="sh-arrow r" aria-label="다음">▶</button>
      <div class="sh-card"><img src="${IMG['face_d_' + b.id]}" alt=""><div class="sh-info"><h3>${b.name}</h3><p>${b.desc}</p>
        <div class="talent">${[['speed', '달리기'], ['jump', '점프'], ['catch', '잡기'], ['focus', '집중']].map(([k, n]) => `<span>${n} ${'●'.repeat(b[k])}${'○'.repeat(5 - b[k])}</span>`).join('')}</div>
        <div class="pers">${b.pers.map((p) => `<button class="${P === p ? 'on' : ''}" data-p="${p}">${PERS[p].icon} ${PERS[p].name}</button>`).join('')}</div><p class="muted">${PERS[P].desc}</p>
        <div class="row"><input id="dn" maxlength="8" placeholder="이름을 지어 주세요 (예: ${['초코', '콩이', '보리', '하루', '구름', '단비', '별이', '두부'][sel]})" aria-label="강아지 이름"><button class="btn big" data-a="adopt">💗 가족이 되기</button></div></div></div>`;
    el.querySelector('.sh-arrow.l').onclick = () => { sel = (sel + 7) % 8; persPick = null; Sound.sfx('ui'); Sound.bark({ breed: BREEDS[sel].id }, 1); draw(); };
    el.querySelector('.sh-arrow.r').onclick = () => { sel = (sel + 1) % 8; persPick = null; Sound.sfx('ui'); Sound.bark({ breed: BREEDS[sel].id }, 1); draw(); };
    el.querySelectorAll('[data-p]').forEach((x) => (x.onclick = () => { persPick = x.dataset.p; Sound.sfx('ui'); draw(); }));
    const x = el.querySelector('.sh-x'); if (x) x.onclick = () => close(false);
    el.querySelector('[data-a=adopt]').onclick = () => {
      const name = el.querySelector('#dn').value.trim(); if (!name) { UI.toast('이름을 지어 주세요!'); el.querySelector('#dn').focus(); return; }
      const breed = b.id, pers = persPick || b.pers[0];
      if (first) { close(true); Game.start(st); Game.adopt(breed, name, pers); Game.makePups(); Game.placePupsHome(); UI.refresh(); setTimeout(() => welcome(name), 400); }
      else { close(false); Game.adopt(breed, name, pers); Game.S.active = Game.S.dogs.length - 1; UI.refresh(); UI.toast(`💗 ${J(name, '이', '가')} 새 가족이 되었어요!`); }
    };
  }
  function welcome(name) {
    const d = Game.D();
    UI.talk({ name: '보호소 선생님', face: 'n_shop', text: `${J(name, '이', '가')} ${Game.S.player.name}님 집에 왔어요! 처음엔 낯설어할 수 있으니 먼저 살살 쓰다듬어 주세요. 강아지 위를 누른 채로 문지르면 돼요. 밥, 목욕, 산책, 훈련… 하나씩 해 보면서 최고의 단짝이 되어 주세요!`, choices: [{ t: '잘 돌볼게요!', f: () => { UI.endTalk(); UI.toast('📔 다이어리 1장: 강아지를 5번 쓰다듬어요.'); } }] });
    void d;
  }
  function close(toGame) {
    document.getElementById('shelter').classList.add('hidden'); const rt = Game.rt; rt.shelter = null;
    if (!toGame) { rt.scene = rt.prevScene && rt.prevScene !== 'shelter' ? rt.prevScene : 'home'; if (Game.S && Game.S.dogs.length) { document.getElementById('hud').classList.remove('hidden'); UI.setMode('home'); Game.goHome(true); } else { rt.paused = true; rt.scene = 'title'; UI.showTitle(); } }
  }
  function update(dt) {
    if (!Game.rt.shelter) return;
    pups.forEach((p, i) => {
      p.holdAnim = i === sel ? (Math.floor(Game.rt.t / 2) % 3 === 0 ? 'tilt' : 'happy') : (i % 3 ? 'sit' : 'idle');
      p.update(dt, Game.homeEnv); const k = i === sel ? 1.25 : 1; p.rig.root.s = p.rig.root.s.map(() => BREED[p.D.breed].size * k);
    });
    const p = pups[sel]; Game.rt.camLook = { x: p.x, z: p.z, y: 0.5 };
  }
  return { open, update, close, get pups() { return pups; } };
})();

/* 멍멍 라이프 — 시작 */
'use strict';
(function boot() {
  const t = document.getElementById('title');
  document.getElementById('titleImg').src = IMG.title; t.style.setProperty('--titlebg', `url(${IMG.title})`);
  t.querySelector('.ball').src = IMG.title_ball;
  UI.init(); Progress.init(); Game.init();
  document.getElementById('btnClass').onclick = () => { Sound.sfx('ui'); Progress.studentEnter(); };
  document.getElementById('btnBoard').onclick = () => { Sound.sfx('ui'); Progress.teacherEnter(); };
  try { const ss = JSON.parse(localStorage.getItem('mung-settings') || 'null'); if (ss) { Sound.setVol(ss.bgm, ss.sfx); if (Game.R) Game.R.lowQ = !ss.quality; } } catch (e) { /* 기본값 */ }
  // 시작 화면 발바닥이 둥둥
  for (let i = 0; i < 7; i++) { const p = document.createElement('span'); p.className = 'paw'; p.textContent = '🐾'; p.style.left = 8 + i * 13 + '%'; p.style.animationDelay = i * 1.3 + 's'; t.appendChild(p); }
  UI.showTitle();
})();

</script>
