<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>멍멍 라이프 — 나의 첫 번째 반려견</title>
<meta name="description" content="3D 강아지 키우기 시뮬레이션 — 제작자: 양승분">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>/* 멍멍 라이프 — 화면 꾸밈 (크림 · 나무 · 하늘색, 둥근 발바닥 톤) */
:root {
  --wood: #b9844f; --wood-d: #8a5a32; --paper: #fffaf0; --paper2: #fbefd8; --ink: #4a3322; --ink2: #7a5a40; --sky: #4f8fd8; --leaf: #3fae5a; --leaf-d: #2a8a44;
  --sun: #f5c330; --pink: #f28aa5; --warn: #d8453a; --font: 'Jua', 'Pretendard', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans CJK KR', sans-serif;
  --body: 'Pretendard', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans CJK KR', sans-serif;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; overflow: hidden; background: #8fcff0; color: var(--ink); font-family: var(--body); font-size: 18px; user-select: none; -webkit-user-select: none; touch-action: none; }
#gl { position: fixed; inset: 0; width: 100%; height: 100%; display: block; outline: none; }
button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; }
button:focus-visible, input:focus-visible { outline: 3px solid #ffd65a; outline-offset: 2px; }
.hidden { display: none !important; }
.muted { color: var(--ink2); font-size: 15px; }
.card { background: var(--paper); border: 3px solid var(--wood-d); border-radius: 18px; box-shadow: 0 4px 0 var(--wood-d), 0 8px 18px #0003; }

/* ── 시작 화면 ── */
#title { position: fixed; inset: 0; z-index: 50; overflow: hidden; background: #8fcff0; }
#title::before { content: ''; position: absolute; inset: -30px; background: var(--titlebg) center / cover; filter: blur(16px) brightness(.95); }
#title .art { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); }
#title .art > img:first-child { width: 100%; height: 100%; display: block; }
#title .ball { position: absolute; pointer-events: none; animation: ball 1.6s cubic-bezier(.3, 0, .7, 1) infinite; transform-origin: 50% 100%; filter: drop-shadow(0 6px 4px #0004); }
@keyframes ball { 0%, 100% { transform: translateY(0) scale(1.06, .94); } 12% { transform: translateY(-8%) scale(.97, 1.03); } 50% { transform: translateY(-46%) scale(1, 1); } 88% { transform: translateY(-6%) scale(.98, 1.02); } }
#title .hot { position: absolute; border-radius: 999px; transition: transform .12s, box-shadow .12s, filter .12s; }
#title .hot:hover, #title .hot:focus-visible { transform: scale(1.035); box-shadow: 0 0 0 5px #ffe48a99; filter: brightness(1.05); }
#title .hot:active { transform: scale(.97); }
#title .hot.dim { opacity: .55; }
#title .classrow { position: absolute; right: 1.6%; top: 2.5%; display: flex; gap: 10px; }
#title .classrow button, #title .clsbadge { background: linear-gradient(#fffaf0, #f6e4c0); border: 3px solid var(--wood-d); border-radius: 999px; padding: 8px 16px; font-family: var(--font); font-size: clamp(14px, 1.25vw, 19px); box-shadow: 0 4px 0 var(--wood-d); }
#title .clsbadge { position: absolute; right: 1.6%; top: 11%; border-radius: 14px; font-size: 15px; }
#title .paw { position: absolute; bottom: -40px; font-size: 26px; opacity: .65; animation: up 9s linear infinite; pointer-events: none; }
@keyframes up { to { transform: translateY(-115vh) rotate(40deg); opacity: 0; } }

/* ── HUD ── */
#hud { position: fixed; inset: 0; pointer-events: none; z-index: 10; font-family: var(--font); }
#hud > * { pointer-events: auto; }
#hud[data-mode=walk] .h, #hud[data-mode=home] .w, #hud[data-mode=mini] #bar, #hud[data-mode=mini] #actbtn, #hud[data-mode=mini] #side, #hud[data-mode=mini] #tips, #hud[data-mode=mini] #menu { display: none !important; }
#dogcard { position: absolute; left: 14px; top: 14px; width: 340px; padding: 8px 12px; display: flex; gap: 10px; align-items: center; }
#dogcard img { width: 64px; height: 64px; object-fit: contain; background: #e8f4ff; border-radius: 14px; }
#dogcard b { font-size: 22px; font-weight: normal; }
#dogcard .hearts { color: #e8557a; font-size: 16px; letter-spacing: 1px; } #dogcard .hearts span { color: #e8c0c8; }
#dogcard .muted { font-family: var(--body); font-size: 13px; }
#swap { margin-left: auto; width: 44px; height: 44px; border-radius: 12px; background: var(--paper2); border: 2px solid #e2c99a; font-size: 20px; }
#stats { position: absolute; left: 14px; top: 112px; width: 340px; padding: 8px 12px; display: grid; gap: 4px; }
.st { display: grid; grid-template-columns: 24px 1fr 48px; align-items: center; gap: 6px; font-size: 14px; }
.st i { height: 12px; border-radius: 7px; background: #eadfc8; overflow: hidden; } .st i b { display: block; height: 100%; background: linear-gradient(#8fdc6a, #3fae5a); transition: width .4s; }
.st.low i b { background: linear-gradient(#f6a65a, #e8574a); } .st small { font-family: var(--body); color: var(--ink2); }
#clock { position: absolute; left: 368px; top: 14px; padding: 6px 18px; text-align: center; font-size: 20px; min-width: 190px; }
#hud[data-mode=mini] #clock { display: none; }
#clock .muted { font-size: 13px; font-family: var(--body); }
#topR { position: absolute; right: 14px; top: 14px; display: flex; flex-direction: row-reverse; align-items: flex-start; gap: 8px; }
#coinbox { padding: 6px 16px; font-size: 20px; color: #9a6a12; }
#menu { display: flex; gap: 5px; justify-content: flex-end; }
#menu button { width: 44px; height: 44px; border-radius: 13px; font-size: 21px; display: grid; place-items: center; border-width: 2px; box-shadow: 0 3px 0 var(--wood-d); }
#side { position: absolute; right: 14px; top: 76px; width: 290px; display: flex; flex-direction: column; gap: 8px; }
#chapter, #missions { padding: 8px 12px; font-family: var(--body); font-size: 14px; }
#chapter b, #missions > b { font-family: var(--font); font-weight: normal; font-size: 16px; color: var(--leaf-d); display: block; }
#chapter i { display: block; height: 8px; border-radius: 6px; background: #eadfc8; margin-top: 5px; overflow: hidden; } #chapter i b { height: 100%; background: var(--leaf); }
#missions div { margin-top: 2px; } #missions .done { color: var(--leaf-d); text-decoration: line-through; }
#tips { position: absolute; left: 50%; bottom: 112px; transform: translateX(-50%); display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; pointer-events: none; }
#tips span { background: #fff6e6ee; border: 2px solid #e8b06a; border-radius: 999px; padding: 3px 12px; font-size: 15px; font-family: var(--body); }
#zone { position: absolute; left: 50%; top: 74px; transform: translateX(-50%); font-size: 30px; color: #fff; text-shadow: 0 3px 0 var(--wood-d), 0 0 10px #0006; opacity: 0; pointer-events: none; }
#zone.show { animation: zone 2.6s ease-out; } @keyframes zone { 0% { opacity: 0; transform: translate(-50%, 10px); } 15%, 75% { opacity: 1; transform: translate(-50%, 0); } 100% { opacity: 0; } }
#bar { position: absolute; left: 50%; bottom: 12px; transform: translateX(-50%); display: flex; gap: 4px; padding: 6px; max-width: calc(100vw - 190px); overflow-x: auto; }
#bar button { min-width: 64px; height: 70px; border-radius: 14px; background: #fbf0d8; border: 2px solid #e6cfa2; font-size: 26px; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 2px 6px; }
#bar button small { font-size: 13px; font-family: var(--body); white-space: nowrap; }
#bar button.on { background: #fff; border-color: var(--sun); box-shadow: 0 0 0 3px #f5c33077; }
#bar button:active { transform: translateY(2px); }
#actbtn { position: absolute; right: 18px; bottom: 16px; width: 140px; min-height: 92px; border-radius: 24px; padding: 10px; background: radial-gradient(circle at 40% 30%, #fff6c8, #f5c330 65%, #e09a1a); border: 4px solid var(--wood-d); box-shadow: 0 6px 0 var(--wood-d), 0 10px 20px #0004; font-family: var(--font); font-size: 18px; line-height: 1.2; }
#joy { position: absolute; left: 22px; bottom: 100px; width: 140px; height: 140px; border-radius: 50%; background: #fff4; border: 3px solid #fffa; touch-action: none; }
#joy i { position: absolute; left: 50%; top: 50%; width: 60px; height: 60px; margin: -30px; border-radius: 50%; background: #fffd; border: 3px solid var(--wood-d); }
#toasts { position: fixed; left: 50%; top: 72px; transform: translateX(-50%); display: flex; flex-direction: column; gap: 8px; align-items: center; pointer-events: none; width: min(600px, 92vw); z-index: 70; }
.toast { background: #fffbf2f4; border: 2px solid var(--wood-d); border-radius: 14px; padding: 8px 18px; font-size: 17px; box-shadow: 0 3px 0 var(--wood-d); animation: tin .25s ease-out; text-align: center; }
.toast.warn { border-color: var(--warn); box-shadow: 0 3px 0 var(--warn); } .toast.event { border-color: var(--sky); box-shadow: 0 3px 0 var(--sky); background: #f2f8ff; }
@keyframes tin { from { transform: translateY(-10px); opacity: 0; } }
.pop { position: fixed; transform: translate(-50%, -50%); font-family: var(--font); font-size: 21px; color: #fff; text-shadow: 0 2px 0 var(--wood-d), 0 0 8px #000a; pointer-events: none; animation: pup 1.3s ease-out forwards; z-index: 65; white-space: nowrap; }
@keyframes pup { to { transform: translate(-50%, -170%); opacity: 0; } }

/* ── 미니게임 ── */
#mini { position: fixed; inset: 0; z-index: 30; pointer-events: none; font-family: var(--font); }
#mini > * { pointer-events: auto; }
#mini .mtop { position: absolute; left: 50%; top: 12px; transform: translateX(-50%); display: flex; gap: 12px; align-items: center; background: var(--paper); border: 3px solid var(--wood-d); border-radius: 999px; padding: 6px 8px 6px 20px; box-shadow: 0 4px 0 var(--wood-d); font-size: 20px; white-space: nowrap; }
#mini .mtop .sub { font-family: var(--body); font-size: 14px; color: var(--ink2); }
#mini .mquit { background: #fbe0dc; border: 2px solid var(--warn); border-radius: 999px; padding: 4px 12px; font-size: 15px; }
#mini .info { position: absolute; left: 50%; top: 70px; transform: translateX(-50%); background: #fffaf0ee; border: 2px solid #e6cfa2; border-radius: 14px; padding: 6px 16px; font-family: var(--body); font-size: 17px; text-align: center; max-width: 92vw; }
#mini .info.cue { background: #fff2a8; border-color: var(--sun); animation: pulse .4s infinite alternate; } @keyframes pulse { to { transform: translateX(-50%) scale(1.05); } }
#mini .stage { position: absolute; left: 50%; bottom: 120px; transform: translateX(-50%); width: min(560px, 90vw); display: flex; flex-direction: column; gap: 8px; align-items: center; }
#mini .gauge { position: relative; width: 100%; height: 34px; border-radius: 18px; background: #f6e7c8; border: 3px solid var(--wood-d); overflow: hidden; }
#mini .gauge .zone { position: absolute; top: 0; bottom: 0; background: #7fd27a; }
#mini .gauge.power { background: linear-gradient(90deg, #cfe8ff, #ffe08a, #ff9a7a); }
#mini .gauge .mark { position: absolute; top: -2px; bottom: -2px; width: 8px; margin-left: -4px; background: #e8453c; border-radius: 4px; box-shadow: 0 0 0 2px #fff; }
#mini .gauge .fill { height: 100%; background: linear-gradient(90deg, #8fdc6a, #3fae5a); transition: width .1s; }
#mini .waitbar { width: 100%; height: 16px; border-radius: 9px; background: #f6e7c8; border: 2px solid var(--wood-d); overflow: hidden; } #mini .waitbar i { display: block; height: 100%; background: var(--sky); }
#mini .lives { font-size: 26px; } #mini .timer { font-size: 34px; color: #fff; text-shadow: 0 3px 0 var(--wood-d), 0 0 8px #0008; }
#mini .pawcue { font-size: 46px; opacity: .25; } #mini .pawcue.pop { animation: pc .5s; } @keyframes pc { 0% { opacity: 1; transform: scale(1.5); } 100% { opacity: .25; transform: scale(1); } }
#mini .judge { background: #fffaf0; border: 3px solid var(--wood-d); border-radius: 16px; padding: 8px 18px; font-size: 24px; }
#mini .steps { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; } #mini .steps span { background: #f6e7c8; border-radius: 999px; padding: 3px 12px; font-size: 15px; font-family: var(--body); } #mini .steps .on { background: var(--sun); } #mini .steps .ok { background: #c8eebc; }
#mini .btns { position: absolute; left: 50%; bottom: 22px; transform: translateX(-50%); display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; width: min(760px, 96vw); }
#mini .mbtn { min-width: 120px; min-height: 64px; padding: 8px 18px; border-radius: 18px; background: #fbf0d8; border: 3px solid var(--wood-d); box-shadow: 0 5px 0 var(--wood-d); font-size: 21px; }
#mini .mbtn.big { min-width: 220px; background: radial-gradient(circle at 40% 30%, #fff6c8, #f5c330 70%); font-size: 26px; }
#mini .mbtn:active { transform: translateY(3px); box-shadow: 0 2px 0 var(--wood-d); }
#mini .tip { background: #fffaf0e8; border-radius: 12px; padding: 6px 14px; font-family: var(--body); }

/* ── 보호소 ── */
#shelter { position: fixed; inset: 0; z-index: 40; pointer-events: none; font-family: var(--font); }
#shelter > * { pointer-events: auto; }
.sh-top { position: absolute; left: 50%; top: 14px; transform: translateX(-50%); background: var(--paper); border: 3px solid var(--wood-d); border-radius: 999px; padding: 8px 20px; box-shadow: 0 4px 0 var(--wood-d); display: flex; gap: 12px; align-items: center; font-size: 22px; white-space: nowrap; }
.sh-top span { font-family: var(--body); font-size: 15px; color: var(--ink2); } .sh-x { background: var(--paper2); border-radius: 999px; padding: 4px 12px; font-size: 15px; }
.sh-arrow { position: absolute; top: 40%; width: 64px; height: 64px; border-radius: 50%; background: var(--paper); border: 3px solid var(--wood-d); box-shadow: 0 4px 0 var(--wood-d); font-size: 26px; } .sh-arrow.l { left: 18px; } .sh-arrow.r { right: 18px; }
.sh-card { position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%); width: min(900px, 96vw); display: flex; gap: 14px; background: var(--paper); border: 4px solid var(--wood-d); border-radius: 24px; padding: 12px 16px; box-shadow: 0 6px 0 var(--wood-d), 0 14px 30px #0005; }
.sh-card > img { width: 150px; height: 150px; object-fit: contain; background: #e8f4ff; border-radius: 18px; }
.sh-info { flex: 1; } .sh-info h3 { margin: 0; font-weight: normal; font-size: 28px; } .sh-info p { margin: 4px 0; font-family: var(--body); font-size: 16px; }
.talent { display: flex; gap: 12px; flex-wrap: wrap; font-family: var(--body); font-size: 14px; color: #c87a1a; }
.pers { display: flex; gap: 8px; margin: 6px 0 2px; } .pers button { background: var(--paper2); border: 2px solid #e2c99a; border-radius: 999px; padding: 5px 14px; font-size: 17px; } .pers button.on { background: var(--sun); border-color: var(--wood-d); }
.sh-info .row input { flex: 1; min-width: 180px; font-size: 19px; padding: 10px 14px; border-radius: 14px; border: 3px solid #e2c99a; font-family: var(--body); }

/* ── 대화창 ── */
#talk { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); width: min(880px, 95vw); z-index: 55; display: flex; gap: 12px; align-items: flex-end; }
#talk .face { width: 130px; height: 130px; border-radius: 22px; background: #e8f4ff; border: 4px solid var(--wood-d); box-shadow: 0 5px 0 var(--wood-d); overflow: hidden; display: grid; place-items: center; flex: none; font-size: 60px; }
#talk .face img { width: 100%; height: 100%; object-fit: contain; }
#talk .box { flex: 1; position: relative; background: #fffbf2; border: 4px solid var(--wood-d); border-radius: 24px; padding: 24px 22px 14px; box-shadow: 0 5px 0 var(--wood-d), 0 12px 26px #0005; }
#talk .nm { position: absolute; left: 20px; top: -19px; background: var(--wood); color: #fff; padding: 3px 16px; border-radius: 999px; font-family: var(--font); font-size: 19px; border: 3px solid #fff; }
#talk .tx { font-size: 19px; line-height: 1.6; min-height: 60px; } #talk .ch { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; margin-top: 8px; }
#talk .ch button { background: var(--paper2); border: 2px solid var(--wood-d); border-radius: 999px; padding: 8px 18px; font-family: var(--font); font-size: 18px; min-height: 44px; } #talk .ch button:hover { background: var(--sun); }

/* ── 창 ── */
#modal { position: fixed; inset: 0; z-index: 60; display: grid; place-items: center; background: #1a12084d; }
.win { position: relative; width: min(820px, 95vw); max-height: 92vh; display: flex; flex-direction: column; background: var(--paper); border: 4px solid var(--wood-d); border-radius: 24px; box-shadow: 0 6px 0 var(--wood-d), 0 18px 40px #0006; animation: wi .2s ease-out; }
@keyframes wi { from { transform: scale(.95); opacity: 0; } }
.win > h2 { margin: 0; padding: 12px 22px; font-family: var(--font); font-weight: normal; font-size: 25px; background: linear-gradient(#c8945a, var(--wood)); color: #fffaf0; border-radius: 18px 18px 0 0; text-shadow: 0 2px 0 var(--wood-d); }
.win .x { position: absolute; right: 12px; top: 9px; width: 42px; height: 42px; border-radius: 50%; background: #fffaf0; border: 2px solid var(--wood-d); font-size: 20px; color: var(--wood-d); }
.win .body { padding: 14px 18px 18px; overflow: auto; }
.tabs { display: flex; gap: 6px; padding: 10px 16px 0; flex-wrap: wrap; } .tabs button { padding: 7px 14px; border-radius: 12px 12px 0 0; background: var(--paper2); border: 2px solid #e2c99a; border-bottom: 0; font-family: var(--font); font-size: 16px; } .tabs button.on { background: #fff; border-color: var(--wood-d); }
.list { display: flex; flex-direction: column; gap: 8px; }
.li { display: flex; align-items: center; gap: 12px; padding: 8px 12px; background: #fff; border: 2px solid #efdfbe; border-radius: 16px; text-align: left; width: 100%; }
button.li:hover { border-color: var(--sun); } .li.done { background: #eef9e8; border-color: #b8dca0; } .li.lock { opacity: .55; }
.li .tx { flex: 1; display: flex; flex-direction: column; gap: 2px; } .li .tx b { font-family: var(--font); font-weight: normal; font-size: 19px; }
.li .ic.big { font-size: 30px; width: 46px; text-align: center; } .ic { flex: none; object-fit: contain; }
.lv { background: var(--sky); color: #fff; border-radius: 8px; padding: 0 8px; font-size: 14px; font-family: var(--body); }
.own { background: #e8f4ff; color: var(--sky); border-radius: 8px; padding: 0 6px; font-size: 13px; }
.coin { color: #a8741a; font-family: var(--font); }
.mbar { display: block; height: 8px; border-radius: 5px; background: #eadfc8; overflow: hidden; margin-top: 3px; } .mbar b { display: block; height: 100%; background: var(--leaf); }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 10px; }
.slot { position: relative; min-height: 100px; border-radius: 16px; background: #fbf0d8; border: 3px solid #e6cfa2; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; padding: 6px; text-align: center; }
.slot small { font-size: 13px; font-family: var(--body); line-height: 1.2; } .slot .n { position: absolute; right: 6px; top: 4px; font-size: 13px; background: var(--wood-d); color: #fff; border-radius: 8px; padding: 0 6px; }
.slot.sel { background: #fff; border-color: var(--sun); box-shadow: 0 0 0 3px #f5c33066; } .slot.lock { opacity: .5; } .slot.trick.lock { filter: grayscale(1); }
.cards .card { padding: 8px; text-align: center; display: flex; flex-direction: column; gap: 2px; border-width: 2px; box-shadow: 0 3px 0 #e2c99a; } .cards .card img { width: 100%; height: 110px; object-fit: contain; } .cards { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
.chip { background: #e8f4ff; border-radius: 999px; padding: 4px 12px; font-size: 15px; } .chip.lock { background: #eee; color: #999; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-top: 10px; } .row.wrap { flex-wrap: wrap; }
.btn { padding: 10px 20px; border-radius: 14px; background: var(--leaf); color: #fff; font-family: var(--font); font-size: 18px; box-shadow: 0 3px 0 var(--leaf-d); min-height: 46px; }
.btn.big { font-size: 22px; padding: 12px 26px; } .btn.alt { background: var(--paper2); color: var(--ink); box-shadow: 0 3px 0 #d8b98a; } .btn.red { background: var(--warn); box-shadow: 0 3px 0 #a83a30; }
.btn:disabled { filter: grayscale(1); opacity: .5; cursor: default; }
.shopkeep { display: flex; gap: 12px; align-items: center; background: #fff5f8; border: 2px solid #f6cad6; border-radius: 16px; padding: 8px 12px; margin-bottom: 12px; } .shopkeep img { width: 70px; height: 70px; object-fit: contain; } .shopkeep p { flex: 1; margin: 0; font-size: 16px; }
.contest .ranks { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 4px; } .rk { background: #fbf0d8; border: 2px solid #e6cfa2; border-radius: 999px; padding: 4px 12px; font-size: 15px; } .rk.won { background: #fff2b8; border-color: var(--sun); } .rk:disabled { opacity: .5; }
.res { text-align: center; } .res .big { font-family: var(--font); font-size: 34px; color: var(--leaf-d); } .res .mis { display: flex; flex-direction: column; gap: 4px; margin: 10px 0; } .res .sleepy { width: 140px; filter: saturate(.9); }
.rank { text-align: left; padding-left: 26px; } .rank li { padding: 4px 0; font-size: 18px; } .rank li img { width: 32px; vertical-align: middle; } .rank li span { float: right; color: var(--ink2); } .rank li.me { font-weight: bold; color: var(--leaf-d); }
.reward { font-family: var(--font); color: #a8741a; font-size: 20px; }
.note { background: #e8f4ff; border-radius: 12px; padding: 6px 12px; } .chk { display: flex; gap: 8px; align-items: center; margin-top: 12px; font-size: 16px; } .chk input { width: 22px; height: 22px; }
.rec { display: flex; gap: 12px; padding: 10px; background: #fff; border: 2px solid #efdfbe; border-radius: 16px; margin-bottom: 10px; font-size: 15px; line-height: 1.6; } .rec img { width: 90px; height: 90px; object-fit: contain; } .spark { display: block; margin-top: 6px; background: #fff8fa; border-radius: 10px; }
.two { display: grid; grid-template-columns: 240px 1fr; gap: 18px; } .pv { background: linear-gradient(#cfeaff, #f2f9ff); border-radius: 18px; display: grid; place-items: center; height: 300px; } .pv img { height: 92%; }
.two label { display: block; font-family: var(--font); font-size: 18px; margin: 12px 0 6px; } .two input { width: 100%; font-size: 20px; padding: 10px 14px; border-radius: 14px; border: 3px solid #e2c99a; font-family: var(--body); } .lead { font-size: 17px; }
.seg { display: flex; gap: 8px; flex-wrap: wrap; } .seg button { background: var(--paper2); border: 2px solid #e2c99a; border-radius: 12px; padding: 8px 16px; min-height: 44px; } .seg button.on { background: var(--sun); border-color: var(--wood-d); }
.set { display: grid; grid-template-columns: 140px 1fr; gap: 12px; align-items: center; } .set input[type=range] { width: 100%; accent-color: var(--leaf); }
h3 { font-family: var(--font); font-weight: normal; margin: 14px 0 8px; }
#fatal { position: fixed; inset: 0; z-index: 99; display: grid; place-items: center; background: #4f8fd8; color: #fff; font-size: 20px; text-align: center; padding: 30px; }
#fade { position: fixed; inset: 0; z-index: 80; background: #fff8ea; opacity: 0; pointer-events: none; transition: opacity .45s; } #fade.on { opacity: 1; }

@media (max-width: 900px), (max-height: 560px) {
  html, body { font-size: 16px; }
  #dogcard { width: 250px; padding: 4px 8px; left: 8px; top: 8px; } #dogcard img { width: 44px; height: 44px; } #dogcard b { font-size: 18px; } #dogcard .hearts { font-size: 12px; }
  #stats { width: 250px; top: 76px; left: 8px; padding: 4px 8px; gap: 2px; } .st { font-size: 12px; grid-template-columns: 20px 1fr 40px; } .st i { height: 9px; }
  #clock { top: 8px; left: 266px; font-size: 15px; min-width: 0; padding: 4px 12px; } #topR { right: 8px; top: 8px; flex-direction: column; align-items: flex-end; } #menu { flex-wrap: wrap; max-width: 220px; } #menu button { width: 38px; height: 38px; font-size: 18px; } #coinbox { font-size: 16px; padding: 4px 10px; }
  #side { display: none; } #bar { bottom: 6px; max-width: calc(100vw - 130px); left: calc(50% - 50px); } #bar button { min-width: 50px; height: 56px; font-size: 20px; } #bar button small { font-size: 11px; }
  #actbtn { width: 108px; min-height: 70px; font-size: 15px; right: 8px; bottom: 8px; } #joy { bottom: 74px; left: 10px; width: 120px; height: 120px; }
  .sh-card { flex-direction: column; } .sh-card > img { display: none; } .two { grid-template-columns: 1fr; } .pv { height: 160px; }
  #talk .face { width: 84px; height: 84px; } #talk .tx { font-size: 16px; }
  #mini .stage { bottom: 96px; } #mini .mbtn { min-height: 52px; font-size: 17px; min-width: 90px; } #mini .mbtn.big { min-width: 160px; font-size: 20px; } #mini .info { top: 60px; font-size: 14px; }
}
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

/* 세로 휴대폰: 상단을 두 줄로 정리 (강아지 카드·시계·코인 / 메뉴 한 줄) */
@media (max-width: 600px) and (orientation: portrait) {
  #dogcard { width: calc(100vw - 16px - 96px); }
  #clock { left: auto; right: 8px; top: 50px; font-size: 13px; padding: 3px 8px; }
  #clock .muted { display: none; }
  #topR { top: 8px; }
  #menu { position: fixed; left: 8px; right: 8px; top: 80px; max-width: none; flex-wrap: nowrap; justify-content: space-between; gap: 3px; }
  #menu button { width: calc((100vw - 16px - 24px) / 9); height: 38px; font-size: 17px; }
  #stats { top: 124px; width: 200px; }
  #bar { left: 8px; transform: none; max-width: calc(100vw - 130px); }
  #toasts { top: 172px; }
}
</style>

<canvas id="gl" tabindex="-1" aria-label="강아지와 함께하는 3D 화면"></canvas>

<div id="title" role="main">
  <div class="art">
    <img id="titleImg" alt="멍멍 라이프 — 나의 첫 번째 반려견. 제작자: 양승분">

</div>

  <div id="topR"><span id="coinbox" class="card">🪙 <b id="coins">0</b></span>
    <div id="menu">
      <button class="card" data-a="bag" title="가방 (I)" aria-label="가방">🎒</button>
      <button class="card" data-a="shop" title="펫숍" aria-label="펫숍">🛍️</button>
      <button class="card h" data-a="closet" title="옷장" aria-label="옷장">👕</button>
      <button class="card h" data-a="decor" title="마당 꾸미기" aria-label="마당 꾸미기">🏡</button>
      <button class="card" data-a="contest" title="대회" aria-label="대회">🏆</button>
      <button class="card" data-a="diary" title="다이어리" aria-label="다이어리">📔</button>
      <button class="card" data-a="dex" title="도감" aria-label="도감">📖</button>
      <button class="card h" data-a="adopt" title="새 가족 (보호소)" aria-label="보호소">🏠</button>
      <button class="card" data-a="settings" title="설정 (Esc)" aria-label="설정">⚙️</button>
    </div>

  <div id="side"><div id="chapter" class="card"></div><div id="missions" class="card"></div></div>
  <div id="tips" class="hidden"></div>
  <div id="zone"></div>
  <div id="bar" class="card">
    <button data-a="call" title="이름 부르기 (C)">🔔<small>부르기</small></button>
    <button data-a="praise" title="칭찬 (P)">👏<small>칭찬</small></button>
    <button class="h" data-tool="hand">✋<small>쓰다듬기</small></button>
    <button class="h" data-tool="brush">🪮<small>빗질</small></button>
    <button data-tool="toy">🎾<small>장난감</small></button>
    <button class="h" data-a="food">🍖<small>먹이·물</small></button>
    <button class="h" data-a="bath">🛁<small>목욕</small></button>
    <button class="h" data-a="train">🎓<small>훈련</small></button>
    <button data-a="tricks">✨<small>재주</small></button>
    <button class="h" data-a="walk">🐾<small>산책</small></button>
    <button class="h" data-a="sleep">💤<small>재우기</small></button>
    <button class="w" data-a="home">🏡<small>집으로</small></button>
  </div>
  <button id="actbtn" aria-label="행동하기"></button>
  <div id="joy" class="hidden" aria-hidden="true"><i></i></div>
</div>

<div id="shelter" class="hidden"></div>

<script>/* ───────────────────────────────────────────────────────────────
   학급코드 키트 (classroom.js) — 게임 HTML 안에 그대로 넣어 쓰는 모듈
   · 학생: 수업 코드 + 번호 + 이름으로 입장 → 진행·정답·작품이 선생님 현황판에 모임
   · 선생님: 수업 코드 만들기 / 다시 열기 → 실시간 현황판
   · 코드 없이 "둘러보기"도 가능 (이때는 아무것도 보내지 않음)
   사용법은 README.md 참고. 게임 쪽에서는 CR.* 함수만 부르면 됩니다.
   ─────────────────────────────────────────────────────────────── */
(function () {
  'use strict';
  const LS = {
    get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
    del(k) { try { localStorage.removeItem(k); } catch {} },
  };
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const $ = (sel, root = document) => root.querySelector(sel);

  const CR = {
    cfg: { game: 'game', api: '', title: '게임', levels: [], teacherNotes: '' },
    session: null,         // 학생: {mode:'class'|'explore', code, sid, num, name, level, title}
    teacher: null,         // 선생님: {code, token, title, level}
    _queue: [], _timer: null, _summary: {}, _t0: Date.now(), _playBase: 0,
  };
  window.CR = CR;

  const K = () => ({ q: `cr_${CR.cfg.game}_queue`, s: `cr_${CR.cfg.game}_student`, t: `cr_${CR.cfg.game}_teachers` });

  /* 서버 종류: 구글 Apps Script 웹 앱(…/exec)이면 'gas', 아니면 Cloudflare Worker */
  const isGas = () => /\/exec(\?|$)/.test(CR.cfg.api || '') || /script\.google(usercontent)?\.com/.test(CR.cfg.api || '');
  CR.isGas = isGas;
  function url(path, q = {}) {
    if (isGas()) { const u = new URLSearchParams({ path, ...q }); return CR.cfg.api + (CR.cfg.api.includes('?') ? '&' : '?') + u; }
    const qs = new URLSearchParams(q).toString(); return CR.cfg.api + path + (qs ? '?' + qs : '');
  }
  // 구글 웹 앱은 미리 묻기(preflight)를 못 받으므로 text/plain 으로 보낸다
  async function request(path, data, opt = {}) {
    const o = data === undefined ? {} : { method: 'POST', headers: { 'content-type': isGas() ? 'text/plain;charset=utf-8' : 'application/json' }, body: JSON.stringify(data), keepalive: !!opt.keepalive };
    const res = await fetch(url(path, opt.q), o);
    const j = await res.json().catch(() => ({ ok: false, error: '서버 응답을 읽지 못했어요.' }));
    if (!j.ok && j.status == null) j.status = res.status;
    return j;
  }
  CR.request = request;
  async function api(path, data, q) {
    const j = await request(path, data, { q });
    if (!j.ok) throw new Error(j.error || '연결에 실패했어요.');
    return j;
  }
  // 구글 시트 서버는 느리고 한 번에 하나씩 처리하므로 덜 자주 보낸다
  const PACE = () => (isGas() ? { flush: 12000, beat: 60000, dash: 10000 } : { flush: 5000, beat: 30000, dash: 5000 });

  /* ───────── 설정 ───────── */
  CR.init = function (cfg) {
    Object.assign(CR.cfg, cfg || {});
    // 서버 주소: 게임 파일에 적힌 주소 → 없으면 링크의 ?server= → 전에 받은 주소
    let qp = null; try { qp = new URLSearchParams(location.search).get('server'); } catch {}
    if (qp && /^https:\/\//.test(qp)) LS.set('cr_server', qp);
    if (!CR.cfg.api) { CR.cfg.api = qp || LS.get('cr_server', '') || ''; CR._apiFromLink = !!CR.cfg.api; }
    injectStyle();
    CR._queue = LS.get(K().q, []);
    const saved = LS.get(K().s, null);
    if (saved && saved.mode === 'class') CR.session = saved;
    clearInterval(CR._timer);
    CR._timer = setInterval(() => CR.flush(), PACE().flush);
    document.addEventListener('visibilitychange', () => { if (document.hidden) CR.flush(true); });
    window.addEventListener('pagehide', () => CR.flush(true));
    return CR;
  };
  CR.isClass = () => !!(CR.session && CR.session.mode === 'class');
  // 학급 서버를 쓸 수 있나? (주소가 있거나, 게임이 Cloudflare Worker에 함께 올라가 있을 때)
  CR.hasServer = () => !!CR.cfg.api || (/^https?:$/.test(location.protocol) && !/github\.io$/.test(location.hostname));
  CR.lastStudent = () => LS.get(K().s, null);

  /* ───────── 기록 보내기 (게임에서 호출) ───────── */
  function push(type, data) {
    if (!CR.isClass()) return;
    // 진행 상황·이어하기 저장은 마지막 것만 있으면 되므로 앞의 것을 지운다 (보낼 양 줄이기)
    if (type === 'state' || type === 'progress') CR._queue = CR._queue.filter((e) => e.type !== type);
    CR._seq = Math.max(CR._seq || 0, ...CR._queue.map((e) => e.n || 0)) + 1;
    CR._queue.push({ n: CR._seq, type, data, ts: Date.now() });
    if (CR._queue.length > 2000) CR._queue = CR._queue.filter((e, i) => e.type === 'answer' || e.type === 'work' || e.type === 'finish' || i > CR._queue.length - 2000);
    LS.set(K().q, CR._queue);
    if (type === 'finish' || type === 'work') CR.flush();
  }
  CR.progress = (chapter, chapterName, progress) => push('progress', { chapter, chapterName, progress });
  CR.answer = (qid, label, correct, tries = 1) => push('answer', { qid, label, correct: !!correct, tries });
  CR.hint = () => push('hint', {});
  CR.work = (kind, title, content, opts = {}) => push('work', { kind, title, content, replace: !!opts.replace });
  CR.finish = (score, ending) => { CR._summary.score = score; push('finish', { score, ending }); };
  CR.saveState = (obj) => push('state', { state: JSON.stringify(obj) });
  CR.setScore = (score) => { CR._summary.score = score; };
  CR.setPlaySec = (sec) => { CR._playOverride = Math.round(sec); };  // 게임이 자체 플레이 시간을 잴 때
  CR.setExtra = (extra) => { CR._summary.extra = { ...(CR._summary.extra || {}), ...extra }; };

  let flushing = false;
  CR.flush = async function (beacon) {
    if (!CR.isClass() || flushing) return;
    const batch = CR._queue.slice(0, 50);
    const playSec = CR._playOverride != null ? CR._playOverride : CR._playBase + Math.round((Date.now() - CR._t0) / 1000);
    if (!batch.length && !beacon && Date.now() - (CR._lastBeat || 0) < PACE().beat) return; // 가끔 "활동 중" 신호
    const body = { code: CR.session.code, sid: CR.session.sid, events: batch, summary: { ...CR._summary, playSec } };
    flushing = true;
    try {
      const j = await request('/api/events', body, { keepalive: !!beacon });
      if (j.ok) {
        const sent = new Set(batch.map((e) => e.n));   // 실제로 보낸 것만 지운다
        CR._queue = CR._queue.filter((e) => !sent.has(e.n));
        LS.set(K().q, CR._queue);
        CR._lastBeat = Date.now();
        setNet(true);
      } else if (j.status === 404) { CR._queue = []; LS.set(K().q, []); }
      else if (j.status === 503) setNet(false);
    } catch { setNet(false); }
    flushing = false;
    if (CR._queue.length && !beacon) setTimeout(() => CR.flush(), 400);
  };
  function setNet(ok) {
    let b = $('#cr-net');
    if (ok) { if (b) b.remove(); return; }
    if (!b) { b = document.createElement('div'); b.id = 'cr-net'; document.body.appendChild(b); }
    b.textContent = '인터넷이 잠시 끊겼어요 · 기록은 기기에 모아 두었다가 다시 보낼게요';
  }

  /* ───────── 공용 오버레이 ───────── */
  function overlay(html, cls = '') {
    closeOverlay();
    const o = document.createElement('div');
    o.id = 'cr-ov';
    o.className = cls;
    o.innerHTML = html;
    document.body.appendChild(o);
    const first = o.querySelector('input,button,select');
    if (first) setTimeout(() => first.focus(), 30);
    return o;
  }
  function closeOverlay() { const o = $('#cr-ov'); if (o) o.remove(); }
  CR.close = closeOverlay;

  /* ───────── 학생 입장 ─────────
     CR.studentEntry() → Promise<{mode, level, state, resumed, name, num}>  */
  CR.studentEntry = function () {
    return new Promise((resolve) => {
      const last = CR.lastStudent();
      const o = overlay(`
        <form class="cr-card" id="cr-join" autocomplete="off">
          <h2>수업에 들어가기</h2>
          <p class="cr-sub">선생님이 알려 준 수업 코드와 번호, 이름을 써 주세요.</p>
          <label>수업 코드<input id="cr-code" maxlength="6" inputmode="text" placeholder="예: K7PM3Q" value="${esc(last?.code || '')}" required></label>
          <div class="cr-row">
            <label class="cr-num">번호<input id="cr-num" maxlength="3" inputmode="numeric" value="${esc(last?.num || '')}" required></label>
            <label>이름<input id="cr-name" maxlength="12" value="${esc(last?.name || '')}" required></label>
          </div>
          <p class="cr-note">같은 코드·번호·이름으로 다시 들어오면 하던 곳부터 이어서 할 수 있어요.</p>
          <p class="cr-err" id="cr-err" role="alert"></p>
          <div class="cr-actions">
            <button type="button" class="cr-ghost" id="cr-back">← 처음으로</button>
            <button type="submit" class="cr-main">입장하기</button>
          </div>
        </form>`);
      $('#cr-code', o).addEventListener('input', (e) => { e.target.value = e.target.value.toUpperCase().replace(/[^A-Z0-9]/g, ''); });
      $('#cr-back', o).onclick = () => { closeOverlay(); resolve(null); };
      $('#cr-join', o).onsubmit = async (e) => {
        e.preventDefault();
        const code = $('#cr-code', o).value.trim(), num = $('#cr-num', o).value.trim(), name = $('#cr-name', o).value.trim();
        const btn = $('.cr-main', o); btn.disabled = true; btn.textContent = '확인 중…';
        try {
          const r = await CR.join(code, num, name);
          closeOverlay();
          resolve(r);
        } catch (err) {
          $('#cr-err', o).textContent = err.message;
          btn.disabled = false; btn.textContent = '입장하기';
        }
      };
    });
  };
  /* 화면 없이 입장 (자동 테스트·외부 입장 화면용) */
  CR.join = async function (code, num, name) {
    const j = await api('/api/join', { code, num, name, game: CR.cfg.game });
    let state = null; try { state = j.state ? JSON.parse(j.state) : null; } catch {}
    CR.session = { mode: 'class', code: String(code).toUpperCase().trim(), sid: j.sid, num, name, level: j.level, title: j.title };
    LS.set(K().s, CR.session);
    CR._t0 = Date.now(); CR._playBase = (state && state.__playSec) || 0;
    CR.flush();
    return { mode: 'class', level: j.level, state, resumed: j.resumed, name, num, title: j.title };
  };
  CR.explore = function (level) {
    CR.session = { mode: 'explore', level };
    return { mode: 'explore', level, state: null };
  };
  CR.leave = function () { CR.flush(true); CR.session = null; };

  /* ───────── 선생님: 만들기 / 다시 열기 ───────── */
  CR.teacherEntry = function () {
    const recent = LS.get(K().t, []).filter((r) => !r.expiresAt || r.expiresAt > Date.now());
    LS.set(K().t, recent);
    const lv = CR.cfg.levels.length
      ? `<label>학년 단계<select id="cr-lv">${CR.cfg.levels.map((l) => `<option value="${esc(l.id)}">${esc(l.label)}</option>`).join('')}</select></label>` : '';
    const o = overlay(`
      <div class="cr-card cr-wide">
        <h2>선생님 모드</h2>
        <div class="cr-two">
          <form id="cr-make" autocomplete="off">
            <h3>새 수업 코드 만들기</h3>
            <label>수업 이름<input id="cr-title" maxlength="40" placeholder="예: 5학년 3반 3교시" required></label>
            ${lv}
            <label>선생님 비밀번호 (숫자 4~8자리)<input id="cr-pin" inputmode="numeric" maxlength="8" type="password" required></label>
            <p class="cr-note">비밀번호는 이 수업 현황판을 다시 열 때 씁니다. 학생에게는 알려 주지 마세요.</p>
            <button class="cr-main" type="submit">수업 코드 만들기</button>
          </form>
          <form id="cr-reopen" autocomplete="off">
            <h3>만든 수업 다시 열기</h3>
            <label>수업 코드<input id="cr-rcode" maxlength="6" required></label>
            <label>비밀번호<input id="cr-rpin" inputmode="numeric" maxlength="8" type="password" required></label>
            <button class="cr-sec" type="submit">현황판 열기</button>
            ${recent.length ? `<div class="cr-recent"><b>이 기기에서 연 수업</b>${recent.map((r, i) =>
              `<button type="button" data-i="${i}">${esc(r.title)} <span>${esc(r.code)}</span></button>`).join('')}</div>` : ''}
          </form>
        </div>
        <p class="cr-err" id="cr-err" role="alert"></p>
        <div class="cr-actions"><button type="button" class="cr-ghost" id="cr-back">← 처음으로</button></div>
      </div>`);
    const err = (m) => { $('#cr-err', o).textContent = m; };
    $('#cr-back', o).onclick = closeOverlay;
    $('#cr-rcode', o).addEventListener('input', (e) => { e.target.value = e.target.value.toUpperCase().replace(/[^A-Z0-9]/g, ''); });
    o.querySelectorAll('.cr-recent button').forEach((b) => (b.onclick = () => {
      const r = recent[+b.dataset.i]; openDashboard(r);
    }));
    $('#cr-make', o).onsubmit = async (e) => {
      e.preventDefault();
      try {
        const j = await api('/api/class/create', {
          game: CR.cfg.game, title: $('#cr-title', o).value, level: $('#cr-lv', o)?.value || '', pin: $('#cr-pin', o).value,
        });
        remember(j); showCode(j);
      } catch (x) { err(x.message); }
    };
    $('#cr-reopen', o).onsubmit = async (e) => {
      e.preventDefault();
      try {
        const j = await api('/api/class/open', { code: $('#cr-rcode', o).value, pin: $('#cr-rpin', o).value });
        remember(j); openDashboard(j);
      } catch (x) { err(x.message); }
    };
  };
  function remember(j) {
    const list = LS.get(K().t, []).filter((r) => r.code !== j.code);
    list.unshift({ code: j.code, token: j.token, title: j.title, level: j.level, expiresAt: j.expiresAt });
    LS.set(K().t, list.slice(0, 6));
  }
  // 자동 삭제 시각 표시 ("10월 16일 (금) 오전 7:30")
  function whenText(ms) {
    return new Date(ms).toLocaleString('ko-KR', { month: 'long', day: 'numeric', weekday: 'short', hour: 'numeric', minute: '2-digit' });
  }
  function leftText(ms) {
    const h = Math.max(0, (ms - Date.now()) / 3600e3);
    if (h < 1) return '1시간 안에';
    const H = Math.ceil(h), d = Math.floor(H / 24), r = H % 24;
    return d ? `${d}일${r ? ' ' + r + '시간' : ''} 뒤` : `${H}시간 뒤`;
  }
  function levelLabel(id) { return (CR.cfg.levels.find((l) => l.id === id) || {}).label || id || ''; }
  function joinUrl() { return location.origin + location.pathname + (CR._apiFromLink ? '?server=' + encodeURIComponent(CR.cfg.api) : ''); }

  function showCode(j) {
    const o = overlay(`
      <div class="cr-card cr-code-card">
        <p class="cr-sub">${esc(j.title)}${j.level ? ' · ' + esc(levelLabel(j.level)) : ''}</p>
        <h2>수업 코드</h2>
        <div class="cr-bigcode" aria-label="수업 코드">${esc(j.code).split('').map((c) => `<span>${c}</span>`).join('')}</div>
        <ol class="cr-steps">
          <li>${CR._apiFromLink ? '「학생용 링크 복사」를 눌러 받은 링크를 학생들에게 보내 주세요.' : `학생은 <b>${esc(joinUrl())}</b> 에 들어갑니다.`}</li>
          <li><b>학생</b>을 누르고 이 코드와 번호·이름을 씁니다.</li>
          <li>들어온 학생은 현황판에 바로 나타납니다.</li>
        </ol>
        ${j.expiresAt ? `<p class="cr-expire">🗑 이 수업 코드와 학생 기록은 <b>${esc(whenText(j.expiresAt))}</b>에 자동으로 지워져요.<br>남겨 둘 기록은 그 전에 현황판 「설정」에서 CSV로 내려받으세요.</p>` : ''}
        <div class="cr-actions">
          <span><button class="cr-ghost" id="cr-copy" type="button">코드 복사</button>${CR._apiFromLink ? ' <button class="cr-ghost" id="cr-link" type="button">학생용 링크 복사</button>' : ''}</span>
          <button class="cr-main" id="cr-go" type="button">현황판 열기</button>
        </div>
      </div>`, 'cr-dim');
    $('#cr-copy', o).onclick = () => { navigator.clipboard?.writeText(j.code); $('#cr-copy', o).textContent = '복사했어요'; };
    const ln = $('#cr-link', o); if (ln) ln.onclick = () => { navigator.clipboard?.writeText(joinUrl()); ln.textContent = '복사했어요'; };
    $('#cr-go', o).onclick = () => openDashboard(j);
  }

  /* ───────── 선생님 현황판 ───────── */
  let dashTimer = null, dashData = null, dashTab = 'status', dashSort = 'num';
  function openDashboard(t) {
    CR.teacher = t;
    const o = overlay(`
      <div class="cr-dash">
        <header class="cr-dh">
          <div><h2 id="cr-dtitle">${esc(t.title)}</h2>
            <p class="cr-sub">수업 코드 <b class="cr-mono">${esc(t.code)}</b> ${t.level ? ` · <span id="cr-dlevel">${esc(levelLabel(t.level))}</span>` : ''} · <span id="cr-dsync">불러오는 중…</span></p>
            <p class="cr-sub cr-expireline"><span id="cr-dexpire"></span></p></div>
          <div class="cr-dbtns">
            <button class="cr-ghost" id="cr-showcode">코드 크게 보기</button>
            <button class="cr-ghost" id="cr-print">인쇄</button>
            <button class="cr-ghost" id="cr-exit">닫기</button>
          </div>
        </header>
        <nav class="cr-tabs" role="tablist">
          ${[['status', '학생 현황'], ['items', '문항 분석'], ['gallery', '작품 갤러리'], ['writing', '글·다짐 모아보기'], ['settings', '설정']]
            .map(([k, l]) => `<button role="tab" data-tab="${k}" aria-selected="${k === dashTab}">${l}</button>`).join('')}
        </nav>
        <main id="cr-dbody" class="cr-dbody"></main>
      </div>`, 'cr-full');
    o.querySelectorAll('.cr-tabs button').forEach((b) => (b.onclick = () => { dashTab = b.dataset.tab; o.querySelectorAll('.cr-tabs button').forEach((x) => x.setAttribute('aria-selected', x === b)); render(); }));
    $('#cr-exit', o).onclick = () => { clearInterval(dashTimer); closeOverlay(); };
    $('#cr-print', o).onclick = () => window.print();
    $('#cr-showcode', o).onclick = () => { clearInterval(dashTimer); showCode(t); };
    load();
    clearInterval(dashTimer);
    dashTimer = setInterval(load, PACE().dash);
  }
  CR.openDashboard = openDashboard;

  async function load() {
    const t = CR.teacher; if (!t) return;
    try {
      const j = await request('/api/dashboard', undefined, { q: { code: t.code, token: t.token } });
      if (!j.ok) throw new Error(j.error);
      dashData = j;
      const s = $('#cr-dsync'); if (s) s.textContent = `${new Date().toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit', second: '2-digit' })} 업데이트 · ${PACE().dash / 1000}초마다 자동 새로고침${isGas() ? ' · 구글 시트 저장' : ''}`;
      const ex = $('#cr-dexpire'), at = j.class.expiresAt;
      if (ex && at) { ex.textContent = `🗑 ${whenText(at)} 자동 삭제 (${leftText(at)})`; ex.classList.toggle('cr-soon', at - Date.now() < 24 * 3600e3); }
      render(true);
    } catch (e) {
      const s = $('#cr-dsync'); if (s) s.textContent = '연결 실패 — ' + e.message;
    }
  }

  const ago = (ms) => { const s = Math.max(0, Math.round(ms / 1000)); return s < 60 ? `${s}초 전` : s < 3600 ? `${Math.floor(s / 60)}분 전` : `${Math.floor(s / 3600)}시간 전`; };
  const mins = (sec) => sec < 60 ? `${sec}초` : `${Math.round(sec / 60)}분`;
  function statusOf(st, now) {
    if (st.finished) return ['done', '✓', '완료'];
    if (st.stuck) return ['help', '!', '도움 필요'];
    if (now - st.last_seen < 90_000) return ['live', '●', '활동 중'];
    return ['idle', '○', '멈춤'];
  }

  function render(fromTimer) {
    const body = $('#cr-dbody'); if (!body || !dashData) return;
    if (fromTimer && (body.contains(document.activeElement) && /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName))) return;
    const d = dashData, now = d.now;
    if (dashTab === 'status') {
      const S = d.students;
      const n = S.length, live = S.filter((s) => now - s.last_seen < 90_000 && !s.finished).length;
      const done = S.filter((s) => s.finished).length, help = S.filter((s) => s.stuck && !s.finished).length;
      const avg = (f) => (n ? Math.round(S.reduce((a, s) => a + f(s), 0) / n) : 0);
      const sorted = [...S].sort({
        num: (a, b) => (parseInt(a.num) || 0) - (parseInt(b.num) || 0),
        progress: (a, b) => b.progress - a.progress,
        score: (a, b) => b.score - a.score,
        help: (a, b) => (b.stuck ? 1 : 0) - (a.stuck ? 1 : 0) || a.progress - b.progress,
      }[dashSort]);
      body.innerHTML = `
        <section class="cr-stats">
          ${[['입장', n + '명'], ['지금 활동', live + '명'], ['완료', done + '명'], ['도움 필요', help + '명'], ['평균 진행', avg((s) => s.progress) + '%'], ['평균 점수', avg((s) => s.score) + '점']]
            .map(([k, v]) => `<div><span>${k}</span><b>${v}</b></div>`).join('')}
        </section>
        ${n === 0 ? `<p class="cr-empty">아직 들어온 학생이 없어요. 학생들에게 수업 코드 <b class="cr-mono">${esc(d.class.code)}</b>를 알려 주세요.</p>` : `
        <div class="cr-sortbar">정렬
          ${[['num', '번호순'], ['progress', '진행순'], ['score', '점수순'], ['help', '도움 필요 먼저']].map(([k, l]) =>
            `<button data-sort="${k}" aria-pressed="${dashSort === k}">${l}</button>`).join('')}</div>
        <div class="cr-tablewrap"><table class="cr-table">
          <thead><tr><th>번호</th><th>이름</th><th>상태</th><th>지금 하는 곳</th><th class="cr-w">진행</th><th>점수</th><th>정답률</th><th>힌트</th><th>시간</th><th>마지막 활동</th></tr></thead>
          <tbody>${sorted.map((s) => {
            const [k, ic, lb] = statusOf(s, now);
            const tot = s.correct + s.wrong;
            return `<tr data-sid="${esc(s.sid)}" tabindex="0">
              <td>${esc(s.num)}</td><td class="cr-name">${esc(s.name)}</td>
              <td><span class="cr-st cr-${k}"><i>${ic}</i>${lb}</span>${s.stuck && !s.finished ? `<small class="cr-stuck">${esc(s.stuck)}</small>` : ''}</td>
              <td>${esc(s.finished ? (s.ending || '끝까지 완료') : (s.chapter_name || '시작 전'))}</td>
              <td><div class="cr-bar" aria-label="${s.progress}%"><div style="width:${s.progress}%"></div></div><small>${s.progress}%</small></td>
              <td class="cr-numc">${s.score}</td>
              <td class="cr-numc">${tot ? Math.round((s.correct / tot) * 100) + '%' : '–'}</td>
              <td class="cr-numc">${s.hints}</td>
              <td class="cr-numc">${mins(s.play_sec)}</td>
              <td class="cr-dim2">${ago(now - s.last_seen)}</td></tr>`;
          }).join('')}</tbody></table></div>`}
        <p class="cr-legend">● 활동 중: 1분 30초 안에 기록이 들어옴 · ○ 멈춤 · ! 도움 필요: 한 문제를 3번 이상 틀림 · ✓ 완료</p>`;
      body.querySelectorAll('[data-sort]').forEach((b) => (b.onclick = () => { dashSort = b.dataset.sort; render(); }));
      body.querySelectorAll('tr[data-sid]').forEach((tr) => { tr.onclick = () => studentDetail(tr.dataset.sid); tr.onkeydown = (e) => { if (e.key === 'Enter') studentDetail(tr.dataset.sid); }; });
    } else if (dashTab === 'items') {
      const Q = d.questions;
      const rows = Q.map((q) => ({ ...q, rate: q.n ? Math.round((q.first_ok / q.n) * 100) : 0 }));
      const low = [...rows].filter((r) => r.n >= 3 && r.rate < 70).sort((a, b) => a.rate - b.rate).slice(0, 3);
      body.innerHTML = !Q.length ? '<p class="cr-empty">아직 푼 문항이 없어요.</p>' : `
        ${low.length ? `<section class="cr-callout"><b>다시 짚어 볼 문항</b> ${low.map((r) => `${esc(r.label || r.qid)} (한 번에 맞힌 학생 ${r.rate}%)`).join(' · ')}</section>` : ''}
        <table class="cr-table cr-items"><thead><tr><th>문항</th><th class="cr-w">한 번에 맞힌 비율</th><th>푼 학생</th><th>결국 맞힘</th><th>평균 시도</th></tr></thead>
        <tbody>${rows.map((r) => `<tr><td>${esc(r.label || r.qid)}</td>
          <td><div class="cr-bar ${r.rate < 50 ? 'cr-low' : ''}"><div style="width:${r.rate}%"></div></div><small>${r.rate}%${r.rate < 50 ? ' · 어려워함' : ''}</small></td>
          <td class="cr-numc">${r.n}명</td><td class="cr-numc">${r.ok}명</td><td class="cr-numc">${(+r.avg_tries).toFixed(1)}회</td></tr>`).join('')}</tbody></table>`;
    } else if (dashTab === 'gallery' || dashTab === 'writing') {
      const pics = dashTab === 'gallery';
      const W = d.works.filter((w) => (/^data:image\//.test(w.content)) === pics);
      if (!W.length) { body.innerHTML = `<p class="cr-empty">아직 모인 ${pics ? '작품' : '글'}이 없어요.</p>`; return; }
      const groups = {};
      W.forEach((w) => { (groups[w.title || w.kind] ||= []).push(w); });
      body.innerHTML = Object.entries(groups).map(([g, list]) => `
        <section class="cr-group"><h3>${esc(g)} <small>${list.length}개</small></h3>
        <div class="${pics ? 'cr-gal' : 'cr-wall'}">${list.map((w) => `
          <figure class="cr-work ${w.hidden ? 'cr-hidden' : ''}" data-id="${w.id}">
            ${pics ? `<img src="${esc(w.content)}" alt="${esc(w.name)}의 작품">` : `<blockquote>${esc(w.content)}</blockquote>`}
            <figcaption><span>${esc(w.num)}번 ${esc(w.name || '')}</span>
              <button data-act="big">크게</button>
              <button data-act="${w.hidden ? 'showWork' : 'hideWork'}">${w.hidden ? '다시 보이기' : '숨기기'}</button></figcaption>
          </figure>`).join('')}</div></section>`).join('');
      body.querySelectorAll('.cr-work button').forEach((b) => (b.onclick = async (e) => {
        e.stopPropagation();
        const fig = b.closest('.cr-work'); const id = +fig.dataset.id;
        if (b.dataset.act === 'big') return bigView(W.find((w) => w.id === id), pics);
        await settings(b.dataset.act, { id }); load();
      }));
    } else if (dashTab === 'settings') {
      const c = d.class;
      body.innerHTML = `
        <section class="cr-set">
          <div><h3>학생 입장</h3><p>${c.isOpen ? '지금은 새 학생이 들어올 수 있어요.' : '입장이 닫혀 있어요. 이미 들어온 학생은 이어서 할 수 있어요.'}</p>
            <button class="cr-sec" data-a="${c.isOpen ? 'close' : 'open'}">${c.isOpen ? '입장 닫기' : '입장 다시 열기'}</button></div>
          <div><h3>기록 내려받기</h3><p>학생별 진행·점수·정답 수를 엑셀에서 열 수 있는 파일로 받습니다.</p>
            <button class="cr-sec" data-csv>CSV 내려받기</button></div>
          ${CR.cfg.teacherNotes ? `<div class="cr-notes"><h3>수업 운영 메모</h3>${CR.cfg.teacherNotes}</div>` : ''}
          <div class="cr-danger"><h3>기록 지우기</h3><p>지운 기록은 되돌릴 수 없어요. 이 수업은 ${c.expiresAt ? esc(whenText(c.expiresAt)) + '에' : '만든 지 3일이 지나면'} 코드와 학생 기록이 모두 자동으로 지워집니다.</p>
            <button class="cr-warn" data-a="resetData">학생 기록만 모두 지우기</button>
            <button class="cr-warn" data-a="deleteClass">이 수업 코드 삭제</button></div>
        </section>`;
      body.querySelector('[data-csv]').onclick = () => downloadCsv(d);
      body.querySelectorAll('[data-a]').forEach((b) => (b.onclick = async () => {
        const a = b.dataset.a;
        if ((a === 'resetData' || a === 'deleteClass') && !confirm(a === 'deleteClass' ? '이 수업과 모든 학생 기록을 지울까요?' : '학생 기록을 모두 지울까요?')) return;
        await settings(a);
        if (a === 'deleteClass') {
          LS.set(K().t, LS.get(K().t, []).filter((r) => r.code !== c.code));
          clearInterval(dashTimer); closeOverlay(); return;
        }
        load();
      }));

  }
  /* CSV는 현황판 자료로 브라우저에서 바로 만든다 (어느 서버든 같은 방식) */
  function downloadCsv(d) {
    const head = ['번호', '이름', '지금 하는 곳', '진행률(%)', '점수', '맞힌 수', '틀린 수', '힌트', '완료', '엔딩', '플레이(분)', '처음 입장', '마지막 활동'];
    const t = (ms) => new Date(ms + 9 * 3600e3).toISOString().replace('T', ' ').slice(0, 16);
    const q = (v) => `"${String(v ?? '').replace(/"/g, '""')}"`;
    const extraKeys = [...new Set(d.students.flatMap((s) => Object.keys(s.extra || {})))];
    const rows = d.students.map((s) => [s.num, s.name, s.chapter_name, s.progress, s.score, s.correct, s.wrong, s.hints, s.finished ? 'O' : '', s.ending, Math.round(s.play_sec / 60), t(s.joined), t(s.last_seen), ...extraKeys.map((k) => { const v = (s.extra || {})[k]; return typeof v === 'object' ? JSON.stringify(v) : v; })].map(q).join(','));
    const csv = '\ufeff' + [head.concat(extraKeys).map(q).join(','), ...rows].join('\r\n');
    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
    a.download = `${d.class.title || 'class'}_${d.class.code}.csv`; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  }

/* 멍멍 라이프 — 게임 데이터 (품종·성격·아이템·훈련·대회·이야기·이벤트) */
'use strict';

  const has = (id, n = 1) => (S.inv[id] || 0) >= n;
  function give(id, n = 1, quiet) {

    S.inv[id] = (S.inv[id] || 0) + n; S.dex.items[id] = (S.dex.items[id] || 0) + n; if (!quiet) UI.pop(`${UI.iconText(id)} +${n}`); UI.refresh();
  }
  function take(id, n = 1) { if (!has(id, n)) return false; S.inv[id] -= n; if (S.inv[id] <= 0) delete S.inv[id]; UI.refresh(); return true; }
  const price = (id) => Math.round(ITEMS[id].price * (todayEv().sale || 1));

  /* ── 시간·날 ── */
  const hour = () => S.min / 60;
  const todayEv = () => DAY_EVENTS.find((e) => e.id === S.event) || DAY_EVENTS[0];
  const weather = () => rt.forceWeather || todayEv().weather;
  function pickDayEvent(day) {

    const list = DAY_EVENTS.filter((e) => !e.min || day >= e.min); let tot = list.reduce((a, e) => a + e.w, 0), q = r() * tot;

  }
  function pickMissions(day) {

    while (out.length < 3) { s = (s * 16807) % 2147483647; out.push(pool.splice(s % pool.length, 1)[0].id); }
    return out.map((id) => ({ id, done: 0 }));
  }
  function startDay(first) {
    S.event = pickDayEvent(S.day); S.today = { pet: 0, walk: 0, trains: 0, meals: 0, fetch: 0, brush: 0, greet: 0, found: 0, tricks: 0, greeted: {}, pops: 0 };
    S.missions = pickMissions(S.day); S.min = 7 * 60; S.bowl.water = Math.max(S.bowl.water, 60);

    if (!first) { UI.dayCard(ev); Sound.sfx('morning'); }

    // 기념일: 입양 7일마다
    for (const d of S.dogs) if (S.day > d.born && (S.day - d.born) % 7 === 0) { S.flags['bday_' + d.id + '_' + S.day] = 1; setTimeout(() => UI.toast(`🎉 오늘은 ${J(d.name, '과', '와')} 함께한 지 ${S.day - d.born}일째 되는 날! 우편함에 선물이 있어요.`), 2200); S.mailGift = 'party_hat'; }
    rt.nextPop = 40 + rnd() * 50;
    save(true);
  }
  function endDay() {

    S.log.push({ day: S.day, dog: d.name, bond: heartOf(d), walk: Math.round(S.today.walk), missions: done, event: todayEv().title });
    if (S.log.length > 80) S.log.shift();

  }
  function tickTime(dt) {

  }
  // 한 시간마다 상태 변화 (너무 빠르지 않게)
  function onHour() {
    const ev = todayEv();
    for (const d of S.dogs) {
      const P = PERS[d.pers];
      d.hunger = clamp(d.hunger - 5 * (P.hunger || 1), 0, 100);
      d.clean = clamp(d.clean - 1.6, 0, 100);
      const p = pupOf(d); const resting = p && (p.mode === 'sleep');
      d.energy = clamp(d.energy + (resting ? 14 * (ITEMS[S.furn.bed].sleep || 1) : -3 * P.energy * (ev.hot ? 1.5 : 1)), 0, 100);
      const needs = (d.hunger < 25) + (d.clean < 25) + (d.energy < 15) + (S.bowl.water < 10);
      d.happy = clamp(d.happy + (needs ? -3 * needs : -0.8), 0, 100);
      d.health = clamp(d.health + (d.hunger < 12 || d.clean < 12 ? -2 : d.tummy ? -1 : 1), 0, 100);

    Sound.pickTrack(); UI.refresh(); Progress.sync();
    if (hour() >= 20 && hour() < 21 && rt.scene === 'walk') UI.toast('🌆 해가 지고 있어요. 슬슬 집으로 돌아갈까요?');
  }

  /* ── 강아지 한 마리 (행동) ── */
  class Pup {
    constructor(d) {
      this.D = d; this.rig = DogModel.build(d.breed, d.wear); this.shadow = new Node(DogModel.mesh('shadow', (g) => g.cyl(0.55, 0.55, 0.01, 18, '#000000')), { alpha: 0.2, unlit: true });
      this.x = 0; this.z = 0; this.y = 0; this.vy = 0; this.ry = 0; this.mode = 'idle'; this.t = 1 + rnd() * 2; this.anim = 'idle'; this.at = 0; this.carry = null; this.speed = 0; this.lock = 0;

    }
    rebuild() { const r = this.rig; this.rig = DogModel.build(this.D.breed, this.D.wear); this.rig.root.p = r.root.p; }
    say(anim, dur, then) { this.mode = 'act'; this.actAnim = anim; this.t = dur; this.at = 0; this.then = then || null; }
    goTo(x, z, sp, then, anim) { this.mode = 'move'; this.tx = x; this.tz = z; this.msp = sp || this.sp * 0.55; this.then = then || null; this.moveAnim = anim; this.stuck = 0; }

          if (env.ok(nx, nz)) { this.x = nx; this.z = nz; } else if (env.ok(nx, this.z)) this.x = nx; else if (env.ok(this.x, nz)) this.z = nz; else this.stuck += dt;

        }
        case 'act': anim = this.actAnim; if (this.t <= 0) { this.mode = 'idle'; this.t = 0.8 + rnd() * 2; const f = this.then; this.then = null; if (f) f(this); } break;
        case 'sleep': anim = 'sleep'; if (rt.scene === 'home' && d.energy >= 98 && hour() < 21.5) { this.mode = 'idle'; this.t = 1; UI.toast(`${J(d.name, '이', '가')} 기지개를 켜며 일어났어요.`); } break;
        case 'hold': anim = this.holdAnim || 'sit'; break;           // 훈련·대회에서 붙잡아 둠
        case 'script': anim = this.scriptAnim || 'idle'; break;      // 미니게임이 직접 움직임
        case 'follow': {

          if (this.sniff && this.sniff.t > 0) { this.sniff.t -= dt; anim = 'sniff'; break; }

      if (S.bowl.water > 5 && rnd() < 0.08) { const b = Scenes.HOME.spots.bowl; return this.goTo(b[0] + 0.38, b[1] + 0.75, this.sp * 0.6, (p) => { p.face(b[0] + 0.38, b[1]); p.say('drink', 2, () => { S.bowl.water = Math.max(0, S.bowl.water - 8); }); }); }

  }

  /* ── 집 장면 ── */
  const homeEnv = {
    ok(x, z) {
      const B = Scenes.HOME.bound; if (x < B.x0 || x > B.x1 || z < B.z0 || z > B.z1) return false;
      for (const k in Scenes.HOME.spots) { const s = Scenes.HOME.spots[k], id = S.furn[k]; if (!id || k === 'bowl' || k === 'bed') continue; const r = k === 'house' ? 1.0 : id === 'pool' ? 1.2 : 0.6; if (Math.hypot(x - s[0], z - s[1]) < r) return false; }

    floor: 0,
  };
  function buildHome() {

    refreshFurn();
  }
  function refreshFurn() {

    for (const k in Scenes.HOME.spots) { const id = S.furn[k]; if (!id) continue; const n = Scenes.furn(id); const s = Scenes.HOME.spots[k]; n.at(s[0], 0, s[1]); n.r[1] = s[2]; H.root.add(n); H.furn[k] = n; }
    // 그릇 속 사료·물
    const bw = Scenes.HOME.spots.bowl;
    H.food = H.root.add(Scenes.toy('food')); H.food.at(bw[0] - 0.38, -0.02, bw[1]); H.water = H.root.add(Scenes.toy('water')); H.water.at(bw[0] + 0.38, 0, bw[1]);
    updBowls();
  }
  function updBowls() { const H = rt.home; if (!H || !H.food) return; H.food.visible = S.bowl.food > 0; H.water.visible = S.bowl.water > 5; H.water.p[1] = -0.12 + S.bowl.water / 100 * 0.1; }
  function placePupsHome() {

  }

    rt.scene = 'home'; rt.walk && (rt.walk.active = 0); clearToys(); placePupsHome();
    rt.cam.yawT = 0; rt.cam.yaw = 0; rt.cam.dist = 7.2; rt.cam.pitch = 0.42;
    UI.setMode('home'); Sound.pickTrack(); if (!quiet) UI.toast('🏡 집에 돌아왔어요.'); save();
  }
  // 앞쪽 (카메라 쪽) 서 있는 자리 — 부르면 여기로 옴
  function frontSpot() {
    const c = rt.cam, B = Scenes.HOME.bound;
    return [clamp(c.tx + Math.sin(c.yaw) * 2.4, B.x0 + 0.5, B.x1 - 0.5), clamp(c.tz + Math.cos(c.yaw) * 2.4, B.z0 + 0.5, B.z1 - 0.5)];
  }

  /* ── 돌봄 행동 ── */
  function bond(d, n, why) {
    const before = heartOf(d); d.bond = clamp(d.bond + n * PERS[d.pers].bond * (n > 0 && d.shine ? 1.15 : 1), 0, 100);
    const after = heartOf(d); if (after > before) { UI.toast(`💗 ${J(d.name, '과', '와')} 더 가까워졌어요! 친밀도 ♥${after}`); Sound.sfx('heart'); FX.hearts(pupOf(d), 5); checkTricks(d); }
    void why; Progress.check();
  }
  function happy(d, n) { d.happy = clamp(d.happy + n, 0, 100); }
  function petStroke(p, part) {
    const d = p.D; d.stats.pet++; S.today.pet++; rt.lastGood = rt.t;
    // 하루에 너무 많이 쓰다듬으면 친밀도 상승이 점점 줄어요(하루 12번까지는 그대로) → 매일 꾸준히 돌보는 게 중요
    const pf = S.today.pet <= 12 ? 0.8 : clamp(0.8 - (S.today.pet - 12) * 0.03, 0.08, 0.8);
    const shyLow = d.pers === 'shy' && d.bond < 20;
    if (part === 'tail') { p.say('bark', 0.8); p.face(rt.cam.tx + Math.sin(rt.cam.yaw) * 5, rt.cam.tz + Math.cos(rt.cam.yaw) * 5); happy(d, -1); Sound.bark(d, 1); UI.pop('꼬리는 싫어요!'); return; }
    if (shyLow && rnd() < 0.4) { p.say('shy', 1.2); bond(d, 0.6 * pf); UI.pop('살짝 부끄러워해요…'); return; }
    if (part === 'belly') { p.say('belly', 1.6); bond(d, 1.6 * pf); happy(d, 4); FX.hearts(p, 3); Sound.sfx('pant'); return; }
    if (part === 'ear') { p.say('tilt', 0.9); bond(d, 0.8 * pf); happy(d, 1.5); FX.hearts(p, 1); return; }
    if (part === 'head') { p.say('happy', 1.2); bond(d, 1.1 * pf); happy(d, 2.5); FX.hearts(p, 2); }
    if (part === 'back') { p.say('happy', 1.0); bond(d, 0.9 * pf); happy(d, 2); FX.hearts(p, 1); d.backRubs = (d.backRubs || 0) + 1;

  }
  function callDog(p) {

    } else { p.say(d.pers === 'shy' ? 'shy' : 'tilt', 1.4); UI.pop(d.pers === 'shy' ? '아직 조금 망설여요…' : '딴 데 정신이 팔렸어요!'); bond(d, 0.2); }
  }
  function praise() {
    const p = activePup(); if (!p) return; const d = p.D; Sound.sfx('praise');
    if (rt.t - (rt.lastGood || -99) < 6) { bond(d, 2); happy(d, 4); p.say('happy', 1.4); FX.hearts(p, 4); UI.pop('잘했어! 💗'); rt.lastGood = -99; }
    else { bond(d, 0.3); p.say('tilt', 0.8); UI.pop('칭찬은 잘했을 때 하면 더 좋아요'); }
  }
  function feed(id) {
    const it = ITEMS[id]; const p = activePup(); if (!p || !take(id)) return;
    const d = p.D;
    if (id.startsWith('food_')) { S.bowl.food = 1; S.bowl.foodId = id; updBowls(); Sound.sfx('pour'); UI.toast(`밥그릇에 ${J(it.name, '을', '를')} 담았어요. ${J(d.name, '이', '가')} 냄새를 맡고 와요!`);
      const b = Scenes.HOME.spots.bowl; p.goTo(b[0] - 0.38, b[1] + 0.75, p.sp * 0.85, (pp) => { pp.face(b[0] - 0.38, b[1]); pp.say('eat', 3.2, () => eatBowl(pp)); }); return; }

    const full = d.hunger > 95; d.hunger = clamp(d.hunger + it.feed, 0, 100); happy(d, it.happy); Sound.sfx('crunch'); p.say(id === 'cake' ? 'beg' : 'happy', 1.3);
    if (full) { d.tummy = 2; d.health = clamp(d.health - 6, 0, 100); UI.toast(`${J(d.name, '이', '가')} 배가 너무 불러요. 간식은 조금만 주세요. (잠시 쉬면 괜찮아져요)`, 'warn'); }
    else UI.pop(`${it.name} 냠냠! 💗`);
    bond(d, 0.8); if (rt.t - (rt.lastGood || -99) < 6) { bond(d, 1.2); rt.lastGood = -99; }
  }
  function eatBowl(p) {
    const d = p.D; if (!S.bowl.food) return; const it = ITEMS[S.bowl.foodId] || ITEMS.food_basic;
    const full = d.hunger > 92;
    d.hunger = clamp(d.hunger + it.feed, 0, 100); happy(d, it.happy); if (it.health) d.health = clamp(d.health + it.health, 0, 100); if (it.shine) d.shine = Math.max(d.shine, 1);

    if (full) { d.tummy = 2; d.health = clamp(d.health - 5, 0, 100); UI.toast(`${J(d.name, '이', '가')} 배불러서 조금 남겼어요. 너무 많이 주지 않아도 괜찮아요.`); }

/* 멍멍 라이프 — 이야기(다이어리) 진행 + 학급코드(공통 학급 시스템) 연결 */
'use strict';
const Progress = (() => {

      const c = CHAPTERS[S.chapter]; S.chapter++;
      S.coins += c.reward.coins; if (c.reward.item) Game.give(c.reward.item, c.reward.n || 1, true);
      Sound.sfx('fanfare');
      UI.toast(`📔 ${S.chapter}장 「${c.title}」 완료! 🪙${c.reward.coins}${c.reward.item ? ` + ${ITEMS[c.reward.item].name}${c.reward.n > 1 ? ' ×' + c.reward.n : ''}` : ''}`);

  }

    const c = CHAPTERS[Math.min(S.chapter, CHAPTERS.length - 1)];
    CR.progress(S.chapter, S.chapter >= CHAPTERS.length ? '다이어리 완성' : c.title, Math.round(S.chapter / CHAPTERS.length * 100));

  }
